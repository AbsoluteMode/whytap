<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="b1"></feGaussianBlur>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b2"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="b1"></feMergeNode>
        <feMergeNode in="b2"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <linearGradient id="stroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe8ff"></stop>
      <stop offset="35%" stop-color="#5fb8ff"></stop>
      <stop offset="100%" stop-color="#1a7cff"></stop>
    </linearGradient>
  </defs>

  
  <g filter="url(#halo)">
    <rect x="7.2" y="2.6" width="12" height="14.4" rx="2.8" ry="2.8" fill="none" stroke="#3aa0ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></rect>
    <rect x="4.6" y="7" width="12.6" height="14.6" rx="2.8" ry="2.8" fill="none" stroke="#3aa0ff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></rect>
  </g>

  
  <rect x="7.2" y="2.6" width="12" height="14.4" rx="2.8" ry="2.8" fill="none" stroke="url(#stroke)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"></rect>
  <rect x="4.6" y="7" width="12.6" height="14.6" rx="2.8" ry="2.8" fill="none" stroke="url(#stroke)" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"></rect>

  
  <rect x="7.2" y="2.6" width="12" height="14.4" rx="2.8" ry="2.8" fill="none" stroke="#ffffff" stroke-width="0.35" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"></rect>
  <rect x="4.6" y="7" width="12.6" height="14.6" rx="2.8" ry="2.8" fill="none" stroke="#ffffff" stroke-width="0.35" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"></rect>
</svg>