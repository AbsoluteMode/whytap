    <svg overflow="visible" width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>
  <!-- gradient direction adjusted so icons do not share the same highlight position -->
  <linearGradient id="orb-account-orbStroke" x1="20" y1="58" x2="44" y2="6" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.46" stop-color="#FFF8FF"/>
    <stop offset="0.73" stop-color="#D8BEFF"/>
    <stop offset="1" stop-color="#8B6CFF"/>
  </linearGradient>
  <filter id="orb-account-orbGlow" x="-24" y="-24" width="112" height="112" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="4.8" result="orbBlurLarge"/>
    <feFlood flood-color="#8B6CFF" flood-opacity="0.78" result="orbViolet"/>
    <feComposite in="orbViolet" in2="orbBlurLarge" operator="in" result="violetGlow"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="1.55" result="orbBlurSmall"/>
    <feFlood flood-color="#FFFFFF" flood-opacity="0.72" result="orbWhite"/>
    <feComposite in="orbWhite" in2="orbBlurSmall" operator="in" result="whiteGlow"/>
    <feMerge>
      <feMergeNode in="violetGlow"/>
      <feMergeNode in="whiteGlow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="orb-account-symbolGlow" x="6" y="6" width="52" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.9" result="symbolBlur"/>
    <feFlood flood-color="#FFFFFF" flood-opacity="0.55" result="symbolWhite"/>
    <feComposite in="symbolWhite" in2="symbolBlur" operator="in" result="symbolGlow"/>
    <feMerge>
      <feMergeNode in="symbolGlow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
