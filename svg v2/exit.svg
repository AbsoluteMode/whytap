    <feFlood flood-color="#FFFFFF" flood-opacity="0.72" result="orbWhite"/>
    <feComposite in="orbWhite" in2="orbBlurSmall" operator="in" result="whiteGlow"/>
    <feMerge>
      <feMergeNode in="violetGlow"/>
      <feMergeNode in="whiteGlow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="orb-exit-symbolGlow" x="6" y="6" width="52" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceGraphic" stdDeviation="0.9" result="symbolBlur"/>
    <feFlood flood-color="#FFFFFF" flood-opacity="0.55" result="symbolWhite"/>
    <feComposite in="symbolWhite" in2="symbolBlur" operator="in" result="symbolGlow"/>
    <feMerge>
      <feMergeNode in="symbolGlow"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
